<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Imóvel | ImóvelPro</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100">
    <div class="flex h-screen overflow-hidden">
        <!-- Menu Lateral (igual ao index.html) -->
        <aside id="sidebar" class="w-64 bg-white dark:bg-gray-800 shadow-lg fixed h-full z-50 transition-all duration-300">
            <div class="p-4 border-b border-gray-200 dark:border-gray-700">
                <h2 class="text-2xl font-bold text-green-600">ImóvelPro</h2>
                <p class="text-xs text-gray-500 dark:text-gray-400">CRM Imobiliário Inteligente</p>
            </div>
            <nav class="p-3 space-y-1">
                <a href="index.html" class="menu-item"><i class="fa fa-tachometer mr-2"></i> Dashboard</a>
                <a href="imoveis.html" class="menu-item"><i class="fa fa-building mr-2"></i> Imóveis</a>
                <a href="cadastro-imovel.html" class="menu-item active"><i class="fa fa-plus-circle mr-2"></i> Cadastrar Imóvel</a>
                <a href="clientes.html" class="menu-item"><i class="fa fa-users mr-2"></i> Clientes</a>
                <a href="cadastro-cliente.html" class="menu-item"><i class="fa fa-user-plus mr-2"></i> Cadastrar Cliente</a>
                <a href="funil-crm.html" class="menu-item"><i class="fa fa-line-chart mr-2"></i> Funil CRM</a>
                <a href="agenda.html" class="menu-item"><i class="fa fa-calendar mr-2"></i> Agenda</a>
                <a href="relatorios.html" class="menu-item"><i class="fa fa-file-text-o mr-2"></i> Relatórios</a>
            </nav>
        </aside>

        <main class="ml-64 w-full p-6 overflow-y-auto">
            <header class="mb-6">
                <h1 class="text-2xl font-bold">Cadastrar Novo Imóvel</h1>
                <p class="text-gray-600 dark:text-gray-400">Preencha todos os dados para incluir no sistema</p>
            </header>

            <form id="formImovel" class="bg-white dark:bg-gray-800 rounded-lg shadow p-6 space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Título do Imóvel *</label>
                        <input type="text" name="titulo" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Categoria *</label>
                        <select name="categoria" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                            <option value="Apartamento">Apartamento</option>
                            <option value="Casa">Casa</option>
                            <option value="Terreno">Terreno</option>
                            <option value="Comercial">Comercial</option>
                            <option value="Rural">Rural</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Tipo de Negócio *</label>
                        <select name="tipo" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                            <option value="Venda">Venda</option>
                            <option value="Locação">Locação</option>
                            <option value="Venda/Locação">Ambos</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Cidade *</label>
                        <input type="text" name="cidade" value="Cabo de Santo Agostinho" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Bairro *</label>
                        <input type="text" name="bairro" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">CEP</label>
                        <input type="text" name="cep" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Valor (R$) *</label>
                        <input type="number" name="valor" min="0" required class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Área Total (m²)</label>
                        <input type="number" name="areaTotal" min="0" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Quartos</label>
                        <input type="number" name="quartos" min="0" value="0" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Suítes</label>
                        <input type="number" name="suites" min="0" value="0" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Banheiros</label>
                        <input type="number" name="banheiros" min="0" value="0" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Vagas de Garagem</label>
                        <input type="number" name="garagens" min="0" value="0" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Características</label>
                    <div class="flex flex-wrap gap-4">
                        <label class="flex items-center gap-1">
                            <input type="checkbox" name="piscina"> Piscina
                        </label>
                        <label class="flex items-center gap-1">
                            <input type="checkbox" name="areaGourmet"> Área Gourmet
                        </label>
                        <label class="flex items-center gap-1">
                            <input type="checkbox" name="varanda"> Varanda
                        </label>
                        <label class="flex items-center gap-1">
                            <input type="checkbox" name="jardim"> Jardim
                        </label>
                        <label class="flex items-center gap-1">
                            <input type="checkbox" name="financiamento"> Aceita Financiamento
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Descrição</label>
                    <textarea name="descricao" rows="4" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600"></textarea>
                    <button type="button" id="gerarDescricao" class="mt-2 btn-ia">Gerar Descrição com IA</button>
                </div>

                <div>
                    <label class="block text-sm font-medium mb-1">Fotos do Imóvel</label>
                    <input type="file" id="fotoPrincipal" accept="image/*" class="w-full p-2 border rounded dark:bg-gray-700 dark:border-gray-600">
                    <div id="previewFoto" class="mt-3 w-40 h-32 border rounded bg-gray-100 dark:bg-gray-700 flex items-center justify-center text-gray-500">Prévia da imagem</div>
                </div>

                <div class="flex gap-3 pt-4">
                    <button type="submit" class="btn-primary">Salvar Imóvel</button>
                    <a href="index.html" class="px-4 py-2 border rounded hover:bg-gray-100 dark:hover:bg-gray-700">Cancelar</a>
                </div>
            </form>
        </main>
    </div>

    <script src="js/dados.js"></script>
    <script src="js/ia-funcoes.js"></script>
    <script>
        const form = document.getElementById("formImovel");
        const fotoInput = document.getElementById("fotoPrincipal");
        const preview = document.getElementById("previewFoto");
        let imagemBase64 = "";

        // Prévia da imagem
        fotoInput.addEventListener("change", function() {
            const arquivo = this.files[0];
            if(!arquivo) return;
            const leitor = new FileReader();
            leitor.onload = e => {
                imagemBase64 = e.target.result;
                preview.innerHTML = `<img src="${imagemBase64}" class="w-full h-full object-cover rounded">`;
            };
            leitor.readAsDataURL(arquivo);
        });

        // Gerar descrição IA
        document.getElementById("gerarDescricao").addEventListener("click", () => {
            const dados = Object.fromEntries(new FormData(form));
            const descricao = gerarDescricaoIA({...dados, valor: Number(dados.valor)});
            form.descricao.value = descricao;
        });

        // Salvar cadastro
        form.addEventListener("submit", e => {
            e.preventDefault();
            const dados = Object.fromEntries(new FormData(form));
            const novoImovel = {
                id: Date.now(),
                ...dados,
                valor: Number(dados.valor),
                status: "Disponível",
                imagem: imagemBase64,
                dataCadastro: new Date().toISOString()
            };
            imoveis.push(novoImovel);
            salvarDados();
            alert("✅ Imóvel cadastrado com sucesso!");
            window.location.href = "imoveis.html";
        });
    </script>
</body>
</html>
